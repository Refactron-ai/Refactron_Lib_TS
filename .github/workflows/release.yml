name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(node -p "require('./package.json').version")
          # The wrapper declares its version once, in __init__.py, and
          # pyproject.toml reads it dynamically via setuptools `attr:`. Grepping
          # pyproject for a literal finds the attr expression, not a version.
          PY=$(grep -m1 '^__version__' refactron-py/refactron/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$PY" ]; then
            echo "Could not read __version__ from refactron-py/refactron/__init__.py"
            exit 1
          fi
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          if [ "$TAG" != "$PY" ]; then
            echo "Tag $TAG does not match refactron-py/pyproject.toml version $PY"
            exit 1
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

  test-before-release:
    name: Full Test Suite
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest requests coverage
      - run: npm ci
      - run: npm run typecheck
      # Build first: the CLI drift test asserts against dist/ and fails without it.
      - run: npm run build
      - run: npm test
      - run: node dist/cli/index.js --version

  publish-npm:
    name: Publish to npm
    needs: test-before-release
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # npm OIDC trusted-publisher auth requires npm >= 11.5.1 and Node 20
      # ships an older bundled npm, so this upgrade is mandatory. Pin the MAJOR
      # rather than tracking `latest`: npm 12 dropped Node 20 (it requires
      # ^22.22.2 || ^24.15.0 || >=26.0.0), so `latest` silently became
      # uninstallable here and broke the release. npm 11 supports
      # ^20.17.0 || >=22.9.0, which covers this runner either way.
      - run: npm install -g npm@^11.5.1
      - run: npm run build
      # --ignore-scripts skips prepublishOnly (full test gate). We already
      # ran the equivalent in test-before-release; re-running here would
      # require Python and coverage on this minimal runner for no extra signal.
      - run: npm publish --provenance --access public --ignore-scripts

  publish-pypi:
    name: Publish to PyPI
    needs: test-before-release
    runs-on: ubuntu-latest
    environment:
      name: pypi-production
      url: https://pypi.org/p/refactron
    permissions:
      # A job-level permissions block REPLACES the default set rather than
      # adding to it. Without contents:read, GITHUB_TOKEN cannot read this
      # private repo and actions/checkout fails with "Repository not found".
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wrapper
        working-directory: refactron-py
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: refactron-py/dist
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Install
            ```
            npm install -g refactron@${{ needs.validate-tag.outputs.version }}
            ```
          generate_release_notes: true
