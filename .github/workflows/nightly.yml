name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  real-world-test:
    name: Real-world repo · ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - django/django
          - psf/requests
          - tiangolo/fastapi
          - psf/black
          - pallets/flask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci && npm run build
      - name: Clone target repo
        run: git clone --depth=1 https://github.com/${{ matrix.repo }} /tmp/target
      - name: Run analysis
        run: |
          node dist/cli/index.js analyze /tmp/target \
            --format json \
            --output /tmp/report.json \
            --timeout 120
      - name: Validate output schema
        run: node scripts/validate-report.js /tmp/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.repo }}-report
          path: /tmp/report.json
          retention-days: 30

  notify-on-failure:
    name: Notify on Failure
    needs: real-world-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly regression failure — ${new Date().toISOString().split('T')[0]}`,
              body: `The nightly regression test failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'regression', 'automated']
            })
