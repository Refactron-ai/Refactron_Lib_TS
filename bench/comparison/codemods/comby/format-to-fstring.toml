# Comby template: simple .format() and % formatting -> f-string.
#
# IMPORTANT: Comby has no Python AST. We can only match textual shapes.
# Below are the two simplest patterns that are universally safe:
#   1. "literal {}".format(name)            -> f"literal {name}"
#   2. "literal %s" % name                  -> f"literal {name}"
#
# Anything more complex (multiple holes, format specs, kwargs, multi-line,
# expressions inside format() args) is intentionally not attempted — those
# would require a real parser and produce wrong output otherwise.
#
# Skipped sites are recorded as `missed` by the checker. That's the data.

[fmt-single-hole]
match = '":[before]{}:[after]".format(:[arg])'
rewrite = 'f":[before]{:[arg]}:[after]"'

[pct-single-s]
match = '":[before]%s:[after]" % :[arg]'
rewrite = 'f":[before]{:[arg]}:[after]"'
