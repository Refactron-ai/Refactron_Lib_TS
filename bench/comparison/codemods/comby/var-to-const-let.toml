# Comby template: var -> let
#
# IMPORTANT: Comby is a structural pattern matcher with NO scope or
# data-flow analysis. It cannot tell whether a `var` binding is reassigned,
# so the only honest universal rewrite is `var -> let` (always safe; never
# regresses behavior, but loses const-correctness on every site).
#
# This is documented limitation, not a bug in the codemod. The harness
# records this as `wrong` for every site whose expected outcome is `const`,
# which is exactly the data point the paper makes.
#
# Run:
#   comby -config bench/comparison/codemods/comby/var-to-const-let.toml \
#         -in-place -directory <fixture-dir> -extensions ts

[var-to-let]
match = 'var :[name] :[rest]'
rewrite = 'let :[name] :[rest]'
