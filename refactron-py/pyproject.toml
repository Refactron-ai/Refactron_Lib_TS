[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refactron"
version = "0.2.0"
description = "Safety-first refactoring CLI for Python and TypeScript (Python wrapper around the npm package)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Om Sherikar", email = "omsherikar0229@gmail.com" }]
keywords = ["refactoring", "python", "typescript", "ast", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
refactron = "refactron.cli:main"

[project.urls]
Homepage = "https://github.com/Refactron-ai/Refactron_Lib_TS"
Documentation = "https://docs.refactron.dev"
Issues = "https://github.com/Refactron-ai/Refactron_Lib_TS/issues"
